name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Official GitHub Pages deployment uses OIDC (no token needed)
# pages: write  -> configure & deploy Pages
# id-token: write -> OIDC token for trusted deployment (more secure than GITHUB_TOKEN)
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # GITHUB_REPOSITORY is auto-set by Actions to 'owner/repo'.
        # Vite reads it via process.env to set the correct base path
        # for GitHub Pages (e.g. /CozyFishing/).
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npm run build
          # Prevent Jekyll from mangling SPA routes
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          folder: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
